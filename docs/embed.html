<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="Aperçu animé d’une onde calculée traversant un insert poreux sur un maillage polygonal de 48 cellules.">
  <meta name="theme-color" content="#fbfaf6">
  <title>Onde acoustique sur maillage polygonal</title>
  <style>
    :root {
      color-scheme: light;
      --surface: #fbfaf6;
      --ink: #17252b;
      --focus: #087f8c;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--surface);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .wave-preview {
      display: grid;
      grid-template-rows: 4rem minmax(0, 1fr);
      width: 100%;
      height: 100%;
      min-height: 1px;
      overflow: hidden;
      color: var(--ink);
      background: var(--surface);
    }

    .wave-preview__header {
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-width: 0;
      padding: .55rem .85rem .5rem;
      border-bottom: 1px solid color-mix(in srgb, var(--ink) 10%, transparent);
      background: var(--surface);
    }

    .wave-preview__title {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      font-size: clamp(.92rem, 2.1vw, 1.12rem);
      font-weight: 650;
      letter-spacing: -.015em;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wave-preview__launch {
      flex: 0 0 auto;
      min-height: 2.35rem;
      padding: .52rem .85rem;
      border: 1px solid var(--ink);
      border-radius: 999px;
      color: var(--surface);
      background: var(--ink);
      cursor: pointer;
      font: 700 .78rem/1 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .wave-preview__launch:hover:not(:disabled) {
      color: var(--ink);
      background: var(--surface);
    }

    .wave-preview__launch:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .wave-preview__launch:disabled {
      cursor: wait;
      opacity: .58;
    }

    .wave-preview__stage {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: var(--surface) url("./preview.svg") center / contain no-repeat;
    }

    .wave-preview__stage.is-ready {
      background-image: none;
    }

    .wave-preview__frame {
      position: absolute;
      top: 0;
      left: 50%;
      width: 100%;
      height: min(100%, calc(50vw + 5.3rem));
      border: 0;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%);
    }

    .wave-preview__frame.is-ready { opacity: 1; }

    .wave-preview__link {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: block;
      cursor: pointer;
    }

    .wave-preview__link:focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: -4px;
    }

    .wave-preview__hint {
      position: absolute;
      right: .75rem;
      top: 3rem;
      padding: .4rem .65rem;
      color: var(--ink);
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      font: 600 .78rem/1.2 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      opacity: 0;
      transform: translateY(.2rem);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .wave-preview:hover .wave-preview__hint,
    .wave-preview__link:focus-visible .wave-preview__hint {
      opacity: 1;
      transform: translateY(0);
    }

    @media (hover: none) {
      .wave-preview__hint {
        opacity: .9;
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .wave-preview__hint { transition: none; }
    }

    @media (max-width: 520px) {
      .wave-preview {
        grid-template-rows: 3.75rem minmax(0, 1fr);
      }

      .wave-preview__header {
        padding-inline: .65rem;
      }

      .wave-preview__launch {
        min-height: 2.15rem;
        padding-inline: .7rem;
      }
    }
  </style>
</head>
<body>
  <div class="wave-preview">
    <header class="wave-preview__header">
      <h1 class="wave-preview__title">Onde acoustique sur maillage polygonal</h1>
      <button
        class="wave-preview__launch"
        type="button"
        aria-label="Lancer la simulation"
        disabled>
        <span aria-hidden="true" data-launch-icon>▶</span>
        <span data-launch-label>Chargement…</span>
      </button>
    </header>

    <div class="wave-preview__stage">
      <iframe
        class="wave-preview__frame"
        src="./index.html"
        title="Champ de pression calculé sur un maillage polygonal"
        scrolling="no"
        tabindex="-1"
        aria-hidden="true">
      </iframe>
      <a
        class="wave-preview__link"
        href="./"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Ouvrir la démonstration polygonale interactive complète dans un nouvel onglet">
        <span class="wave-preview__hint" aria-hidden="true">Ouvrir la démonstration complète&nbsp;↗</span>
      </a>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const stage = document.querySelector(".wave-preview__stage");
      const frame = document.querySelector(".wave-preview__frame");
      const launchButton = document.querySelector(".wave-preview__launch");
      const launchIcon = launchButton.querySelector("[data-launch-icon]");
      const launchLabel = launchButton.querySelector("[data-launch-label]");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let finishTimer = 0;
      let playButton = null;
      let frameWindow = null;
      let nativeRequestAnimationFrame = null;
      let nativeCancelAnimationFrame = null;
      let activeAnimationFrames = new Set();
      let previewVisible = true;
      let running = false;

      function clearFinishTimer() {
        window.clearTimeout(finishTimer);
        finishTimer = 0;
      }

      function cancelActiveFrames() {
        if (nativeCancelAnimationFrame) {
          activeAnimationFrames.forEach((identifier) => nativeCancelAnimationFrame(identifier));
        }
        activeAnimationFrames.clear();
      }

      function canLaunch() {
        return Boolean(playButton) && !document.hidden && previewVisible;
      }

      function updateLaunchButton() {
        launchButton.disabled = !canLaunch();

        if (!playButton) {
          launchIcon.textContent = "▶";
          launchLabel.textContent = "Chargement…";
          launchButton.setAttribute("aria-label", "Chargement de la simulation");
          return;
        }

        if (reducedMotion.matches) {
          launchIcon.textContent = "■";
          launchLabel.textContent = "Afficher le résultat";
          launchButton.setAttribute("aria-label", "Afficher le résultat final de la simulation");
          return;
        }

        launchIcon.textContent = running ? "↻" : "▶";
        launchLabel.textContent = running ? "Relancer" : "Lancer la simulation";
        launchButton.setAttribute(
          "aria-label",
          running ? "Relancer la simulation" : "Lancer la simulation"
        );
      }

      function runWave() {
        clearFinishTimer();
        cancelActiveFrames();
        if (!canLaunch()) {
          running = false;
          updateLaunchButton();
          return;
        }

        playButton.disabled = false;
        playButton.click();
        running = !reducedMotion.matches;
        updateLaunchButton();

        if (running) {
          finishTimer = window.setTimeout(() => {
            running = false;
            updateLaunchButton();
          }, 8300);
        }
      }

      function stopWave() {
        clearFinishTimer();
        cancelActiveFrames();
        running = false;
        updateLaunchButton();
      }

      function prepareFrame() {
        let frameDocument = null;
        try {
          frameDocument = frame.contentDocument;
          frameWindow = frame.contentWindow;
        } catch (_error) {
          return;
        }
        if (!frameDocument) return;

        const compactStyle = frameDocument.createElement("style");
        compactStyle.textContent = `
          html, body {
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            overflow: hidden !important;
            background: #fbfaf6 !important;
          }
          .page-shell {
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
          }
          .demo-hero,
          .pw-controls,
          .pw-pressure-legend,
          .pw-energy,
          .demo-footer {
            display: none !important;
          }
          #passive-wave-demo-2026,
          .pw-figure,
          .pw-field {
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
          }
          #passive-wave-demo-2026 {
            display: grid !important;
            grid-template-rows: minmax(0, 1fr) auto !important;
          }
          #passive-wave-demo-2026 .pw-figure {
            min-height: 0 !important;
          }
          #passive-wave-demo-2026 .pw-field {
            aspect-ratio: auto !important;
            border: 0 !important;
          }
          #passive-wave-demo-2026 .pw-learning {
            margin: 0 !important;
            padding: .6rem .8rem .65rem 3.75rem !important;
            border-top: 1px solid var(--border) !important;
            background: var(--background) !important;
          }
          #passive-wave-demo-2026 .pw-learning .pw-section-head {
            margin-bottom: .25rem !important;
            font-size: .76rem !important;
          }
          #passive-wave-demo-2026 .pw-learning .pw-section-head > :last-child,
          #passive-wave-demo-2026 .pw-model-row > .text-small {
            display: none !important;
          }
          #passive-wave-demo-2026 .pw-model-row {
            grid-template-columns: minmax(6.5rem, .55fr) minmax(8rem, 2fr) 3.5rem !important;
            gap: .55rem !important;
            margin-top: .32rem !important;
            font-size: .74rem !important;
          }
          #passive-wave-demo-2026 .pw-error-track {
            grid-column: auto !important;
            grid-row: auto !important;
          }
        `;
        frameDocument.head.appendChild(compactStyle);

        nativeRequestAnimationFrame = frameWindow.requestAnimationFrame.bind(frameWindow);
        nativeCancelAnimationFrame = frameWindow.cancelAnimationFrame.bind(frameWindow);
        frameWindow.requestAnimationFrame = (callback) => {
          let identifier = 0;
          identifier = nativeRequestAnimationFrame((timestamp) => {
            activeAnimationFrames.delete(identifier);
            callback(timestamp);
          });
          activeAnimationFrames.add(identifier);
          return identifier;
        };
        frameWindow.cancelAnimationFrame = (identifier) => {
          activeAnimationFrames.delete(identifier);
          nativeCancelAnimationFrame(identifier);
        };

        playButton = frameDocument.querySelector("[data-pw-play]");
        stage.classList.add("is-ready");
        frame.classList.add("is-ready");
        updateLaunchButton();
      }

      frame.addEventListener("load", prepareFrame, { once: true });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) stopWave();
        else updateLaunchButton();
      });

      reducedMotion.addEventListener("change", () => {
        stopWave();
      });

      launchButton.addEventListener("click", runWave);

      if ("IntersectionObserver" in window) {
        const observer = new IntersectionObserver((entries) => {
          const wasVisible = previewVisible;
          previewVisible = entries[0]?.isIntersecting ?? true;
          if (!previewVisible && wasVisible) stopWave();
          else if (previewVisible !== wasVisible) updateLaunchButton();
        });
        observer.observe(document.body);
      }
    })();
  </script>
</body>
</html>
