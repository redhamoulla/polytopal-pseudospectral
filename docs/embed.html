<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="Animated preview of a computed wave crossing a porous insert on a 48-cell polygonal mesh.">
  <meta name="theme-color" content="#fbfaf6">
  <title>Polytopal wave animation</title>
  <style>
    :root {
      color-scheme: light;
      --surface: #fbfaf6;
      --ink: #17252b;
      --focus: #087f8c;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--surface);
    }

    .wave-preview {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 1px;
      overflow: hidden;
      background: var(--surface) url("./preview.svg") center / contain no-repeat;
    }

    .wave-preview__frame {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(100vw, 200vh);
      height: min(100vh, 50vw);
      border: 0;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .wave-preview__frame.is-ready { opacity: 1; }

    .wave-preview__link {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: block;
      cursor: pointer;
    }

    .wave-preview__link:focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: -4px;
    }

    .wave-preview__toggle {
      position: absolute;
      left: .75rem;
      bottom: .75rem;
      z-index: 3;
      min-width: 2.25rem;
      min-height: 2.25rem;
      padding: .4rem .65rem;
      border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent);
      border-radius: 999px;
      color: var(--ink);
      background: color-mix(in srgb, var(--surface) 90%, transparent);
      box-shadow: 0 2px 12px color-mix(in srgb, var(--ink) 12%, transparent);
      cursor: pointer;
      font: 700 .78rem/1 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .wave-preview__toggle:hover { background: var(--surface); }

    .wave-preview__toggle:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .wave-preview__toggle[hidden] { display: none; }

    .wave-preview__hint {
      position: absolute;
      right: .75rem;
      bottom: .75rem;
      padding: .4rem .65rem;
      color: var(--ink);
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      font: 600 .78rem/1.2 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      opacity: 0;
      transform: translateY(.2rem);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .wave-preview:hover .wave-preview__hint,
    .wave-preview__link:focus-visible .wave-preview__hint {
      opacity: 1;
      transform: translateY(0);
    }

    @media (hover: none) {
      .wave-preview__hint {
        opacity: .9;
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .wave-preview__frame { opacity: 0 !important; }
      .wave-preview__toggle { display: none; }
      .wave-preview__hint { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wave-preview">
    <iframe
      class="wave-preview__frame"
      src="./index.html"
      title="Computed pressure field on a polygonal mesh"
      scrolling="no"
      tabindex="-1"
      aria-hidden="true">
    </iframe>
    <a
      class="wave-preview__link"
      href="./"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open the full interactive polytopal wave demonstration in a new tab">
      <span class="wave-preview__hint" aria-hidden="true">Explore the demonstration&nbsp;↗</span>
    </a>
    <button
      class="wave-preview__toggle"
      type="button"
      aria-label="Pause animation"
      title="Pause animation"
      hidden>
      <span aria-hidden="true" data-pause-icon>Ⅱ</span>
    </button>
  </div>

  <script>
    (() => {
      "use strict";

      const frame = document.querySelector(".wave-preview__frame");
      const animationToggle = document.querySelector(".wave-preview__toggle");
      const pauseIcon = animationToggle.querySelector("[data-pause-icon]");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let replayTimer = 0;
      let playButton = null;
      let frameWindow = null;
      let nativeRequestAnimationFrame = null;
      let nativeCancelAnimationFrame = null;
      let activeAnimationFrames = new Set();
      let userPaused = false;
      let previewVisible = true;

      function stopReplay() {
        window.clearTimeout(replayTimer);
        replayTimer = 0;
      }

      function cancelActiveFrames() {
        if (nativeCancelAnimationFrame) {
          activeAnimationFrames.forEach((identifier) => nativeCancelAnimationFrame(identifier));
        }
        activeAnimationFrames.clear();
      }

      function shouldAnimate() {
        return !userPaused && !reducedMotion.matches && !document.hidden && previewVisible;
      }

      function updateToggle() {
        const paused = !shouldAnimate();
        animationToggle.hidden = reducedMotion.matches || !playButton;
        animationToggle.setAttribute("aria-label", paused ? "Resume animation" : "Pause animation");
        animationToggle.title = paused ? "Resume animation" : "Pause animation";
        pauseIcon.textContent = paused ? "▶" : "Ⅱ";
      }

      function runWave() {
        stopReplay();
        cancelActiveFrames();
        updateToggle();
        if (!playButton || !shouldAnimate()) return;
        playButton.disabled = false;
        playButton.click();
        replayTimer = window.setTimeout(runWave, 8600);
      }

      function prepareFrame() {
        let frameDocument = null;
        try {
          frameDocument = frame.contentDocument;
          frameWindow = frame.contentWindow;
        } catch (_error) {
          return;
        }
        if (!frameDocument) return;

        const compactStyle = frameDocument.createElement("style");
        compactStyle.textContent = `
          html, body {
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            overflow: hidden !important;
            background: #fbfaf6 !important;
          }
          .page-shell {
            width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
          }
          .demo-hero,
          .pw-controls,
          .pw-pressure-legend,
          .pw-energy,
          .pw-learning,
          .demo-footer {
            display: none !important;
          }
          #passive-wave-demo-2026,
          .pw-figure,
          .pw-field {
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
          }
          #passive-wave-demo-2026 .pw-field {
            aspect-ratio: auto !important;
            border: 0 !important;
          }
        `;
        frameDocument.head.appendChild(compactStyle);

        nativeRequestAnimationFrame = frameWindow.requestAnimationFrame.bind(frameWindow);
        nativeCancelAnimationFrame = frameWindow.cancelAnimationFrame.bind(frameWindow);
        frameWindow.requestAnimationFrame = (callback) => {
          let identifier = 0;
          identifier = nativeRequestAnimationFrame((timestamp) => {
            activeAnimationFrames.delete(identifier);
            callback(timestamp);
          });
          activeAnimationFrames.add(identifier);
          return identifier;
        };
        frameWindow.cancelAnimationFrame = (identifier) => {
          activeAnimationFrames.delete(identifier);
          nativeCancelAnimationFrame(identifier);
        };

        playButton = frameDocument.querySelector("[data-pw-play]");
        frame.classList.add("is-ready");
        updateToggle();
        runWave();
      }

      frame.addEventListener("load", prepareFrame, { once: true });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          stopReplay();
          cancelActiveFrames();
          updateToggle();
        }
        else runWave();
      });

      reducedMotion.addEventListener("change", () => {
        if (reducedMotion.matches) {
          stopReplay();
          cancelActiveFrames();
          updateToggle();
        }
        else runWave();
      });

      animationToggle.addEventListener("click", () => {
        userPaused = !userPaused;
        runWave();
      });

      if ("IntersectionObserver" in window) {
        const observer = new IntersectionObserver((entries) => {
          const wasVisible = previewVisible;
          previewVisible = entries[0]?.isIntersecting ?? true;
          if (previewVisible !== wasVisible) runWave();
        });
        observer.observe(document.body);
      }
    })();
  </script>
</body>
</html>
