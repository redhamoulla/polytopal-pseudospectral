[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polytopal-pseudospectral"
version = "0.1.0"
description = "Structure-preserving 2D pseudospectral methods on polygonal meshes with passive neural closures"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Redha Moulla"}]
keywords = [
  "pseudospectral methods",
  "polygonal meshes",
  "port-Hamiltonian systems",
  "scientific machine learning",
  "porous acoustics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Homepage = "https://redhamoulla.com"
Repository = "https://github.com/redhamoulla/polytopal-pseudospectral"
Documentation = "https://redhamoulla.github.io/polytopal-pseudospectral/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
