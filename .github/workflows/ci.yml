name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  MPLCONFIGDIR: /tmp/matplotlib-polytopal-ph

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile
        run: python -m compileall -q src examples tools tests
      - name: Test numerical invariants
        run: python -m pytest -q
      - name: Reproduce released FV comparison
        run: python examples/reproduce_porous_duct.py --check
      - name: Validate embedded demo data
        run: python tools/validate_demo.py --check-only
      - name: Verify release artefact checksums
        run: python tools/verify_manifest.py
